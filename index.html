<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Helike</title>
</head>

<body>
    <header class="barra-navegacao">
        <p class="titulo">Helike</p>
        <nav>
            <a>Categorias</a>
            <a>Produtos</a>
        </nav>
        <button type="button">
            <img src="images/icon-carrinho.png" alt="icone carrinho de compras">
        </button>
        <button type="button">
            <img src="images/icon-usuario.png" alt="icone perfil do usuario">
        </button>
    </header>
    <main>
        <section class="banner-site">
            <figure class="image">
                <img src="images/hero-section.jpg" alt="hero-section">
                <figcaption>UM NOVO JEITO DE PRATICAR ESPORTES</figcaption>
            </figure>
        </section>
        <section class="categoria-produtos">
            <article>COMPRE POR CATEGORIA</article>
            <div class="conteiner-carrossel">
                <figure class="conteiner-image">
                    <img src="images/image2.jpg" alt="imagem corrida">
                    <figcaption>CORRIDA</figcaption>
                </figure>
                <figure class="conteiner-image">
                    <img src="images/image3.jpg" alt="imagem tenis">
                    <figcaption>TÊNIS</figcaption>
                </figure>
                <figure class="conteiner-image">
                    <img src="images/image4.jpg" alt="imagem basquete">
                    <figcaption>BASQUETE</figcaption>
                </figure>
            </div>
        </section>
        <section class="lista-produtos">

        </section>
    </main>
    <a href="botao-ajuda">
    </a>
</body>

</html>
